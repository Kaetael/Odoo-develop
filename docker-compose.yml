      odoo
      -c /etc/odoo/odoo.conf
      -d odoo19_db
      -i base
      --without-demo=all
    volumes:
      - odoo19_data:/var/lib/odoo
      - ./odoo19/config:/etc/odoo
      - ./odoo19/addons:/mnt/extra-addons
    restart: unless-stopped


volumes:
  postgres_data:
  odoo16_data:
  odoo17_data:
  odoo18_data:
  odoo19_data: