    image: odoo:18
    container_name: odoo18
    depends_on:
      - postgres
    ports:
      - "8018:8069"
    command: >
      odoo
      -c /etc/odoo/odoo.conf
      -d odoo18_db
      -i base
      --without-demo=all
    volumes:
      - odoo18_data:/var/lib/odoo
      - ./odoo18/config:/etc/odoo
      - ./odoo18/addons:/mnt/extra-addons
    restart: unless-stopped


  # =========================
  # ODOO 19
  # =========================
  odoo19:
    image: odoo:19
    container_name: odoo19
    depends_on:
      - postgres
    ports:
      - "8019:8069"
